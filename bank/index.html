<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kids Bank</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bank">
  <meta name="theme-color" content="#1a3a5c">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="bank-icon-180.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="weekly.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="bank-logo">
        <span class="bank-logo-icon">🐷</span>
        <div>
          <div class="bank-name">KIDS BANK</div>
          <div class="bank-tagline" id="rateLabel">Loading…</div>
        </div>
      </div>
      <div class="header-right">
        <button class="pending-badge hidden" id="pendingBadge"></button>
        <div class="next-interest-badge" id="nextBadge"></div>
      </div>
    </div>
    <div class="account-tabs" id="accountTabs"></div>
  </header>

  <main class="main" id="mainContent"></main>
  <div class="footer-row">
    <button class="signout-btn" id="pinSettings">Parent PIN</button>
    <button class="signout-btn" id="signOut">Sign out</button>
  </div>

  <!-- Transaction modal -->
  <div class="modal-overlay hidden" id="txModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="txModalTitle">New Transaction</div>
        <button class="modal-close" onclick="closeTxModal()">✕</button>
      </div>
      <div class="tx-type-row" id="txTypeRow">
        <button class="tx-type-btn active" data-type="deposit">⬆️<br>Deposit</button>
        <button class="tx-type-btn" data-type="spend">🛍<br>Spend</button>
        <button class="tx-type-btn" data-type="donate">💝<br>Donate</button>
      </div>
      <div class="form-group">
        <label class="form-label">Amount</label>
        <div class="amount-input-wrap">
          <span class="amount-currency">€</span>
          <input class="amount-input" id="txAmount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description <span class="optional">(optional)</span></label>
        <input class="form-input" id="txNote" type="text" maxlength="40" placeholder="e.g. Birthday money">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeTxModal()">Cancel</button>
        <button class="btn-primary" onclick="confirmTx()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Opening balance modal -->
  <div class="modal-overlay hidden" id="openingModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Opening Balance</div>
        <button class="modal-close" onclick="closeOpeningModal()">✕</button>
      </div>
      <p class="modal-desc">Set the starting balance for this account. This replaces any earlier opening balance.</p>
      <div class="form-group">
        <label class="form-label">Balance</label>
        <div class="amount-input-wrap">
          <span class="amount-currency">€</span>
          <input class="amount-input" id="openingAmount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeOpeningModal()">Cancel</button>
        <button class="btn-primary" onclick="confirmOpening()">Set Balance</button>
      </div>
    </div>
  </div>

  <!-- Parent PIN prompt (approve an allowance / undo a payment) -->
  <div class="modal-overlay hidden" id="pinModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="pinTitle">Parent PIN</div>
        <button class="modal-close" onclick="closePinModal()">✕</button>
      </div>
      <p class="modal-desc" id="pinText"></p>
      <div class="form-group">
        <label class="form-label" for="pinInput">Parent PIN</label>
        <input class="form-input pin-input" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••">
        <div class="pin-error" id="pinError"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closePinModal()">Cancel</button>
        <button class="btn-primary" id="pinConfirm" onclick="confirmPin()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Create / change the parent PIN -->
  <div class="modal-overlay hidden" id="setPinModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="setPinTitle">Parent PIN</div>
        <button class="modal-close" onclick="closeSetPinModal()">✕</button>
      </div>
      <p class="modal-desc" id="setPinText"></p>
      <div class="form-group" id="oldPinGroup">
        <label class="form-label" for="oldPin">Current PIN</label>
        <input class="form-input pin-input" id="oldPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••">
      </div>
      <div class="form-group">
        <label class="form-label" for="newPin">New PIN <span class="optional">(4–8 digits)</span></label>
        <input class="form-input pin-input" id="newPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••">
      </div>
      <div class="form-group">
        <label class="form-label" for="newPin2">Repeat new PIN</label>
        <input class="form-input pin-input" id="newPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••">
        <div class="pin-error" id="setPinError"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeSetPinModal()">Cancel</button>
        <button class="btn-primary" id="setPinConfirm" onclick="confirmSetPin()">Save PIN</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="app.js"></script>
</body>
</html>
