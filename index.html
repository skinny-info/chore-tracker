<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chore Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chores">
  <meta name="theme-color" content="#1D9E75">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="weekly.css">
</head>
<body>

  <div class="install-banner hidden" id="installBanner">
    <span>📲 <strong>Add to Home Screen:</strong> tap Share → "Add to Home Screen"</span>
    <button class="install-banner-close" onclick="dismissBanner()">✕</button>
  </div>

  <header class="page-header">
    <h1>⭐ Chore Tracker</h1>
    <p>Finish your 3 chores each week to earn your allowance!</p>
  </header>

  <div class="week-nav">
    <button class="week-nav-btn" id="weekPrev" aria-label="Previous week">‹</button>
    <div class="week-nav-center">
      <div class="week-nav-title" id="weekTitle"></div>
      <div class="week-nav-sub" id="weekSub"></div>
    </div>
    <button class="week-nav-btn" id="weekNext" aria-label="Next week">›</button>
  </div>

  <main class="main">
    <div class="children-grid" id="grid"></div>
    <div class="footer-row"><button class="signout-btn" id="signOut">Sign out</button></div>
  </main>

  <!-- Avatar picker modal -->
  <div class="modal-overlay hidden" id="avatarModal">
    <div class="modal">
      <div class="modal-title">Choose an avatar</div>
      <div class="emoji-grid" id="emojiGrid"></div>
      <button class="modal-cancel" onclick="closeAvatarModal()">Cancel</button>
    </div>
  </div>

  <!-- Edit an "Other" chore -->
  <div class="modal-overlay hidden" id="editModal">
    <div class="modal">
      <div class="modal-title">What did you do?</div>
      <input class="edit-input" id="editInput" type="text" maxlength="30" placeholder="e.g. fed the dog" autocomplete="off">
      <button class="modal-save" onclick="saveEdit()">Save</button>
      <button class="modal-cancel" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/config.js"></script>
  <script src="shared/core.js"></script>
  <script src="app.js"></script>
</body>
</html>
